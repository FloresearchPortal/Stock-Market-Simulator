<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FloStocks PSX Simulator</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one screen, no page scroll. Header on top, six chart cards fill the rest (3x2 on landscape, 2x3 on portrait).
   News is released manually with the Next headline button at the bottom; each release opens a centred pop-up and then highlights the sectors it moves. */
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --ink:#0a0a0a;
  --muted:#5b625a;
  --tint:#eaf9e0;
  --green:#3bcd00;
  --up:#1c8a00;
  --down:#d6342a;
  --warn:#f0b429;
  --bw:2.5px;
  --sh:5px 5px 0 var(--ink);
  --sh-sm:3px 3px 0 var(--ink);
  --r:6px;
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;
  padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.newsmode{overflow:hidden}
.wrap{flex:1;min-height:0;width:100%;max-width:1700px;margin:0 auto;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--tint);border:2px solid var(--ink);border-radius:4px;padding:4px 7px;margin:0}

header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:clamp(6px,1.3vh,14px)}
.logo{display:block;height:clamp(34px,7.5vh,62px);width:auto;max-width:60vw}
.head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clock{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(6px,1.1vh,9px) 12px;font-size:clamp(11px,1.6vmin,13px);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
.dot.paused{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(59,205,0,0)}0%{box-shadow:0 0 0 0 rgba(59,205,0,.6)}}
.btn{border:var(--bw) solid var(--ink);border-radius:var(--r);background:#fff;box-shadow:var(--sh-sm);padding:clamp(5px,1vh,8px) clamp(10px,1.4vw,15px);font-weight:700;font-size:clamp(12px,1.7vmin,14px);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--green)}

/* chart cards */
.charts{flex:1;min-height:min(420px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.8vmin,22px);padding:0 6px clamp(10px,1.8vmin,18px) 0}
.cc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(8px,1.6vmin,16px) clamp(8px,1.6vmin,16px) clamp(4px,.8vmin,8px);transition:background .5s,border-color .5s,box-shadow .5s}
.cc.hl-up{border-color:var(--up);background:#effbe6;box-shadow:6px 6px 0 var(--up)}
.cc.hl-down{border-color:var(--down);background:#fdeeed;box-shadow:6px 6px 0 var(--down)}
.cc-top{flex:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc-id{min-width:0}
.cc-sec{display:inline-block;font-size:clamp(9px,1.45vmin,11px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--tint);border:2px solid var(--ink);border-radius:4px;padding:2px 6px;white-space:nowrap}
.cc.hl-up .cc-sec{background:var(--up);border-color:var(--up);color:#fff}
.cc.hl-down .cc-sec{background:var(--down);border-color:var(--down);color:#fff}
.cc h2{margin:clamp(3px,.8vmin,8px) 0 0;font-size:clamp(13px,2.4vmin,20px);font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc h2 small{font-size:.62em;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:.02em}
.cc-px{text-align:right;flex:none}
.cc-px .p{font-size:clamp(14px,3vmin,26px);font-weight:700;line-height:1.1;white-space:nowrap}
.cc-px .c{font-size:clamp(11px,1.7vmin,13.5px);margin-top:2px;white-space:nowrap}
.cc-plot{position:relative;flex:1;min-height:0;margin-top:clamp(2px,.6vmin,6px)}
.cc-plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cc-flag{position:absolute;left:4px;bottom:4px;display:none;font:800 clamp(9px,1.45vmin,11px)/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:4px 7px;color:#fff;z-index:1}
.cc.hl-up .cc-flag{display:block;background:var(--up)}
.cc.hl-down .cc-flag{display:block;background:var(--down)}
.cc.hl-flat .cc-flag{display:block;background:var(--muted)}

.foot{flex:none;color:var(--ink);font-weight:700;text-align:center;font-size:clamp(11px,1.7vmin,14px);line-height:1.35;padding:clamp(6px,1vmin,10px) 4px clamp(8px,1.4vmin,14px);border-top:2px solid var(--ink)}
.foot strong{font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-right:4px}

.brand{display:flex;align-items:center;gap:clamp(8px,1.6vw,16px);min-width:0}
.portal{font-weight:800;font-size:clamp(11px,1.9vmin,15px);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(5px,1vh,8px) clamp(8px,1.2vw,12px);white-space:nowrap}
.portal::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px}
.bar{flex:none;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,20px);flex-wrap:wrap;padding-bottom:clamp(8px,1.6vmin,16px)}
.bar .btn.big{padding:clamp(8px,1.5vh,13px) clamp(18px,3vw,34px);font-size:clamp(13px,2.2vmin,17px)}
.bar .prog{font-size:clamp(11px,1.7vmin,13px);color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.imps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.imp{font:700 12px/1 var(--f-display);padding:6px 9px;border-radius:4px;border:1.5px solid currentColor}
.imp.pos{color:var(--up);background:rgba(59,205,0,.12)}
.imp.neg{color:var(--down);background:rgba(214,52,42,.08)}
.imp.flat{color:var(--muted);background:#f3f4f2}
.x{flex:none;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);width:34px;height:34px;font-size:20px;line-height:1;box-shadow:var(--sh-sm)}
.x:hover{background:var(--tint)}

/* breaking news pop-up */
.newsov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px 16px;background:rgba(10,10,10,.22);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:ovin .25s ease}
.newsmodal{position:relative;width:min(640px,100%);max-height:calc(100% - 8px);overflow-y:auto;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:10px 10px 0 var(--ink);padding:clamp(16px,3vh,28px) clamp(16px,4vw,34px);display:grid;gap:clamp(10px,2vh,18px);animation:mdin .35s cubic-bezier(.2,.9,.3,1.2)}
.newsmodal h2{margin:0;font-size:clamp(19px,3.4vmin,30px);line-height:1.2;letter-spacing:-.01em;padding-right:44px}
.tbreak{display:flex;align-items:center;gap:8px;margin:0;font:800 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--down)}
.tbreak .live{width:12px;height:12px;border-radius:50%;background:var(--down);animation:pulseR 1.4s infinite}
@keyframes pulseR{70%{box-shadow:0 0 0 8px rgba(214,52,42,0)}0%{box-shadow:0 0 0 0 rgba(214,52,42,.5)}}
.nwhy{background:var(--tint);border:2px solid var(--ink);border-radius:var(--r);padding:14px 16px}
.nwhy p{margin:0}
.nwhy p+p{margin-top:8px;font-size:clamp(14px,2vmin,15.5px);line-height:1.6}
.nx{position:absolute;top:12px;right:12px}
.nhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ntag{font:700 10.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--green);border:2px solid var(--ink);border-radius:4px;padding:4px 6px}
.ntime{font-size:11.5px;color:var(--muted)}
.reveal-zone{border:var(--bw) dashed var(--ink);border-radius:var(--r);padding:clamp(14px,3vh,22px) 16px;text-align:center;display:grid;gap:12px;justify-items:center;background:repeating-linear-gradient(135deg,#fff 0 10px,#f6fbf2 10px 20px)}
.reveal-zone p{margin:0;color:var(--muted);font-size:14px}
.newsmodal .btn.big{padding:12px 20px;font-size:15px}
.nfoot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);padding-top:14px;font-size:13px;color:var(--muted)}
@keyframes ovin{from{opacity:0}}
@keyframes mdin{from{opacity:0;transform:translateY(18px) scale(.97)}}

/* portrait or narrow screens: 2 columns x 3 rows, still one screen */
@media (max-aspect-ratio:1/1),(max-width:820px){
  .charts{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){
  .cc{box-shadow:3px 3px 0 var(--ink)}
  .cc.hl-up{box-shadow:3px 3px 0 var(--up)}
  .cc.hl-down{box-shadow:3px 3px 0 var(--down)}
  .cc-top{flex-direction:column;gap:2px}
  .cc-px{text-align:left;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .cc h2 small{display:none}
  .logo{max-width:48vw}
}
@media (max-height:460px){.foot{display:none}}
@media (prefers-reduced-motion:reduce){.dot,.tbreak .live,.newsov,.newsmodal{animation:none}.btn,.cc{transition:none}}
</style>

</head>

<script>
(function(){
  var MAX=150, TICK_MS=700, EFFECT_TICKS=25;
  var SEC=[{id:'bank',name:'Banking'},{id:'ogp',name:'Oil & Gas'},{id:'cem',name:'Cement'},{id:'tech',name:'Technology'},{id:'fert',name:'Fertilizer'},{id:'pow',name:'Power'}];
  var STK=[
    {s:'HBL',n:'Habib Bank',sec:'bank',p:142,b:1.0},
    {s:'OGDC',n:'Oil & Gas Development',sec:'ogp',p:215,b:1.1},

    {s:'HUBC',n:'Hub Power',sec:'pow',p:195,b:1.0}

  var NEWS=[
    {tag:'Sector news',head:'Major banks post record profits and announce higher cash dividends',
     pct:{bank:7,ogp:0,cem:0,tech:0,fert:0,pow:0},
     why:'Higher profit means higher earnings per share, and bigger dividends pay shareholders more cash. Investors buy bank shares to collect that income, which pushes bank prices up. Other sectors have no direct link to this news.'},
    {tag:'Sector news',head:'Coal prices surge, sharply raising production costs for cement makers',
     pct:{bank:0,ogp:0,cem:-7,tech:0,fert:0,pow:0},
     why:'Coal is the main fuel used to make cement. When it gets more expensive, each tonne costs more to produce. Unless companies can raise prices by the same amount, profit margins shrink, so investors sell cement shares. Other sectors have no direct link to this news.'},
    {tag:'Sector news',head:'IT exports hit a record high as local software firms win overseas contracts',
     pct:{bank:0,ogp:0,cem:0,tech:8,fert:0,pow:0},
     why:'Technology firms earn in dollars. New foreign contracts and rising exports lift future revenue and earnings once converted to rupees, so investors bid up tech shares.'},
    {tag:'Whole market',head:'State Bank cuts its policy interest rate by 150 basis points',
     pct:{bank:0,ogp:4,cem:7,tech:6,fert:3,pow:5}, neutral:{bank:true},
     why:'A basis point is one hundredth of a percent, so 150 basis points is a 1.5% cut. Cheaper loans cut interest costs for companies, especially debt-heavy ones like cement and power producers. Lower rates also make savings and bonds less attractive, so money moves into shares, and future profits are valued higher. Banks stay roughly neutral: they pay less on deposits but also earn less on loans, so the two effects cancel out.'},
    {tag:'Whole market',head:'Petrol and diesel prices raised sharply by Rs 30 per litre',
     pct:{bank:-3.5,ogp:1,cem:-6,tech:-3,fert:-2,pow:-4},
     why:'Fuel is a cost for almost every business, from transport to factories, and it pushes inflation up. Households spend less and the central bank may keep rates high. Cement and power are hit hardest because they burn a lot of fuel. Oil and gas producers hold up because they sell at higher prices.'}
  ];

  var st;
  var $=function(id){return document.getElementById(id)};
  var fmt=function(v,d){return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
  var pct=function(v){return (v>=0?'+':'')+v.toFixed(2)+'%'};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  function clockLabel(){var m=(9*60+30+st.clock)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
  function secName(id){return SEC.filter(function(s){return s.id===id})[0].name}

  function stepPrices(live){
    var drift={},active=false;SEC.forEach(function(s){drift[s.id]=0});
    st.effects.forEach(function(e){if(e.left>0){active=true;e.left--;for(var k in e.pct)drift[k]+=e.pct[k]/100/e.total}});
    var vol=active?0.0019:0.0012;
    STK.forEach(function(x){
      var mv=gauss()*vol*x.b+drift[x.sec]*x.b;
      st.price[x.s]=Math.max(1,st.price[x.s]*(1+mv));
      st.hist[x.s].push(st.price[x.s]);
      if(st.hist[x.s].length>MAX)st.hist[x.s].shift();
    });
    if(live)st.clock++;
    st.effects=st.effects.filter(function(e){return e.left>0});
    st.T++;
  }

  function buildCards(){
    $('charts').innerHTML=STK.map(function(x){
      return '<section class="cc" id="cc-'+x.s+'"><div class="cc-top"><div class="cc-id"><span class="cc-sec">'+secName(x.sec)+'</span><h2>'+x.n+'<small>'+x.s+'</small></h2></div>'+
        '<div class="cc-px"><div class="p num" id="p-'+x.s+'"></div><div class="c num" id="c-'+x.s+'"></div></div></div>'+
        '<div class="cc-plot"><span class="cc-flag" id="f-'+x.s+'"></span><canvas id="cv-'+x.s+'" aria-label="'+x.n+' live price chart"></canvas></div></section>';
    }).join('');
    STK.forEach(function(x){ if(window.ResizeObserver)new ResizeObserver(function(){drawOne(x)}).observe($('cv-'+x.s).parentNode); });
  }

  function init(){
    closeNewsDom();
    st={price:{},hist:{},open:{},T:0,flags:[],clock:0,effects:[],paused:false,newsOpen:null,hl:{},nextIdx:0};
    STK.forEach(function(x){st.price[x.s]=x.p;st.hist[x.s]=[]});
    for(var i=0;i<MAX;i++)stepPrices(false);
    STK.forEach(function(x){st.open[x.s]=st.price[x.s]});
    buildCards();
    render();
  }

  /* ---------- rendering ---------- */
  function renderCards(){
    STK.forEach(function(x){
      var p=st.price[x.s],c=(p/st.open[x.s]-1)*100;
      $('p-'+x.s).textContent='Rs '+fmt(p,2);
      var ce=$('c-'+x.s);ce.textContent=(c>=0?'▲ ':'▼ ')+pct(c);ce.className='c num '+(c>=0?'up':'down');
      var h=st.hl[x.sec];
      $('cc-'+x.s).className='cc'+(h===1?' hl-up':h===-1?' hl-down':h===0?' hl-flat':'');
      $('f-'+x.s).textContent=h===1?'▲ Up on the news':h===-1?'▼ Down on the news':h===0?'● Neutral on the news':'';
    });
  }
  function renderTopbar(){
    $('clock').textContent=clockLabel();
    var halted=!!st.newsOpen,paused=st.paused||halted;
    $('dot').className='dot'+(paused?' paused':'');
    $('state').textContent=halted?'Paused for news':(st.paused?'Paused':'Market open');
    $('pause').textContent=st.paused?'Resume':'Pause';
    var done=st.nextIdx>=NEWS.length;
    $('nextBtn').disabled=!!st.newsOpen||done;
    $('nextBtn').textContent=done?'All 5 headlines released':'Next headline';
    $('prog').textContent=st.nextIdx+' of '+NEWS.length+' released';
  }
  function impChips(nw){
    return SEC.map(function(s){
      var v=nw.pct[s.id],a=Math.abs(v),w=a>=6?'strongly':a>=3?'moderately':'slightly';
      if(!v&&nw.neutral&&nw.neutral[s.id])return '<span class="imp flat">'+s.name+' · neutral</span>';
      if(!v)return '<span class="imp flat">'+s.name+' · little direct effect</span>';
      return '<span class="imp '+(v>0?'pos':'neg')+'">'+(v>0?'▲ ':'▼ ')+s.name+' · '+w+(v>0?' up':' down')+'</span>';
    }).join('');
  }
  function render(){renderTopbar();renderCards();drawAll()}

  /* ---------- charts ---------- */
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  function drawOne(x){
    if(!st)return;
    var cv=$('cv-'+x.s);if(!cv)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
    if(!W||!H)return;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    var fs=Math.max(8.5,Math.min(11.5,W/30)),R=Math.max(34,Math.min(62,W*0.17)),L=4,T=Math.max(8,Math.round(fs)+14),B=6,cw=W-L-R,ch=H-T-B;
    var s=st.hist[x.s];
    var mn=Math.min.apply(null,s),mx=Math.max.apply(null,s),pad=(mx-mn)*0.14||mn*0.002;mn-=pad;mx+=pad;
    var X=function(i){return L+i/(MAX-1)*cw},Y=function(v){return T+(1-(v-mn)/(mx-mn))*ch};
    var ink=css('--ink'),muted=css('--muted'),up=css('--up'),down=css('--down');
    var last=s[s.length-1],open=st.open[x.s],rising=last>=open,col=rising?up:down;
    ctx.font=fs+'px '+css('--f-mono');ctx.textBaseline='middle';
    var lines=H<110?2:3;
    for(var g=0;g<=lines;g++){
      var v=mn+(mx-mn)*g/lines,y=Math.round(Y(v))+.5;
      ctx.strokeStyle='rgba(10,10,10,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+cw,y);ctx.stroke();
      ctx.fillStyle=muted;ctx.textAlign='left';ctx.fillText(fmt(v,mx-mn<6?2:(mx-mn<40?1:0)),L+cw+6,Y(v));
    }
    if(open>mn&&open<mx){ctx.save();ctx.setLineDash([3,4]);ctx.strokeStyle=muted;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,Y(open));ctx.lineTo(L+cw,Y(open));ctx.stroke();ctx.restore()}
    var grad=ctx.createLinearGradient(0,T,0,T+ch);
    grad.addColorStop(0,rising?'rgba(59,205,0,.26)':'rgba(214,52,42,.2)');grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();s.forEach(function(v,i){i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v))});
    ctx.lineTo(X(s.length-1),T+ch);ctx.lineTo(X(0),T+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    // line: the whole line is green when the price is above its open and red when below
    ctx.lineWidth=Math.max(1.8,Math.min(2.6,W/160));ctx.lineJoin='round';ctx.lineCap='round';
    ctx.strokeStyle=col;
    ctx.beginPath();s.forEach(function(v,i){i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v))});ctx.stroke();
    var dotCol=col;
    var rad=Math.max(3.5,Math.min(5.5,W/70));
    ctx.fillStyle=dotCol;ctx.beginPath();ctx.arc(X(s.length-1),Y(last),rad,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=ink;ctx.lineWidth=1.8;ctx.stroke();
    // news markers: black dashed line at the moment a story hit, with an N tag showing how far the stock moved since
    var base=st.T-s.length;
    ctx.font='700 '+fs+'px '+css('--f-mono');ctx.textBaseline='middle';
    st.flags.forEach(function(f){
      var nw=NEWS[f.i];if(!nw.pct[x.sec])return;
      var i=f.t-base;if(i<0||i>=s.length)return;
      var endI=Math.min(s.length-1,i+EFFECT_TICKS);
      var chg=(s[endI]/f.px[x.s]-1)*100;
      var px=X(i);
      ctx.save();ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(px,T);ctx.lineTo(px,T+ch);ctx.stroke();ctx.restore();
      var tag='N ',pc=(chg>=0?'+':'\u2212')+Math.abs(chg).toFixed(1)+'%';
      var w1=ctx.measureText(tag).width,w2=ctx.measureText(pc).width,w=w1+w2+10,h=fs+7;
      var bx=Math.max(L,Math.min(L+cw-w,px-w/2)),by=2;
      ctx.fillStyle=ink;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,w,h,4);else ctx.rect(bx,by,w,h);ctx.fill();
      ctx.textAlign='left';
      ctx.fillStyle='#fff';ctx.fillText(tag,bx+5,by+h/2+.5);
      ctx.fillStyle=chg>=0?'#5be39a':'#ff8a7a';ctx.fillText(pc,bx+5+w1,by+h/2+.5);
    });
  }
  function drawAll(){STK.forEach(drawOne)}

  /* ---------- breaking news pop-up ---------- */
  function closeNewsDom(){var ov=$('newsOv');if(ov)ov.remove();document.body.classList.remove('newsmode')}
  function releaseNext(){
    if(st.newsOpen||st.nextIdx>=NEWS.length)return;
    var i=st.nextIdx++;
    st.newsOpen={i:i,at:clockLabel(),revealed:false};
    st.hl={};
    showNews();render();
  }
  function showNews(){
    var it=st.newsOpen,nw=NEWS[it.i];
    var ov=$('newsOv');
    if(!ov){ov=document.createElement('div');ov.id='newsOv';ov.className='newsov';document.body.appendChild(ov);document.body.classList.add('newsmode')}
    var inner='<div class="newsmodal" role="dialog" aria-modal="true" aria-labelledby="nmH">'+
      '<button class="x nx" id="nmX" type="button" aria-label="'+(it.revealed?'Close the story and let the market react':'Reveal the impact')+'">×</button>'+
      '<p class="tbreak"><span class="live"></span>Breaking news</p>'+
      '<div class="nhead"><span class="ntag">'+(it.revealed?nw.tag:'Headline')+'</span><span class="ntime num">'+it.at+'</span></div>'+
      '<h2 id="nmH">'+esc(nw.head)+'</h2>';
    if(!it.revealed){
      inner+='<div class="reveal-zone"><p>Which sectors does this move, and why? Think about it, then reveal.</p><button class="btn primary big" id="nmReveal" type="button">Reveal the impact</button></div>'+
        '<div class="nfoot"><span>The market is paused while this story is open.</span></div>';
    }else{
      inner+='<div class="nwhy"><p class="eyebrow">Why it impacts the market</p><p>'+esc(nw.why)+'</p></div>'+
        '<div><p class="eyebrow">Expected effect</p><div class="imps" style="margin-top:10px">'+impChips(nw)+'</div></div>'+
        '<div class="nfoot"><span>The market starts reacting when you close this story.</span><button class="btn primary big" id="nmGo" type="button">Close and watch the market react</button></div>';
    }
    inner+='</div>';
    ov.innerHTML=inner;
    var primary=$(it.revealed?'nmGo':'nmReveal');if(primary)primary.focus();
    $('nmX').onclick=advanceNews;
    if(primary)primary.onclick=advanceNews;
  }
  function advanceNews(){
    var it=st.newsOpen;if(!it)return;
    if(!it.revealed){it.revealed=true;showNews();return}
    st.newsOpen=null;closeNewsDom();
    var nw=NEWS[it.i];
    st.effects.push({pct:nw.pct,left:EFFECT_TICKS,total:EFFECT_TICKS});
    st.hl={};SEC.forEach(function(s){var v=nw.pct[s.id];if(v)st.hl[s.id]=v>0?1:-1;else if(nw.neutral&&nw.neutral[s.id])st.hl[s.id]=0});
    var pxs={};STK.forEach(function(x){pxs[x.s]=st.price[x.s]});
    st.flags.push({i:it.i,t:st.T-1,px:pxs});
    render();
  }
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(st.newsOpen)advanceNews();
  });

  /* ---------- controls ---------- */
  $('nextBtn').addEventListener('click',releaseNext);
  $('pause').addEventListener('click',function(){st.paused=!st.paused;renderTopbar()});
  $('reset').addEventListener('click',init);
  window.addEventListener('resize',drawAll);

  /* ---------- loop ---------- */
  init();
  setInterval(function(){
    if(st.paused||st.newsOpen)return;
    stepPrices(true);
    renderTopbar();renderCards();drawAll();
  },TICK_MS);
})();
</script>

</body>
